server.port=8080
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.error.include-message=always

# Data storage directory (relative to where the JAR/process runs)
cybershield.data.dir=data

# Disable Spring Security's default login page – we handle auth via REST
spring.security.user.name=ignored
spring.security.user.password=ignored

# Allow all origins in dev (Vite proxy handles this in production-like dev mode)
# CORS is configured in CorsConfig.java

# Logging
logging.level.com.cybershield=DEBUG
logging.level.org.springframework.security=WARN
